[project]
name = "redirectr"
revision = "1.0"

[profiles.default]
DATABASE_URL = { description = "Database connection string", default = "sqlite://redirectr.sqlite" }
ADMIN_TOKEN = { description = "Bearer token required to create redirects", required = true }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
DATABASE_URL = { default = "sqlite://redirectr.sqlite" }
ADMIN_TOKEN = { default = "secret" }
